<!doctype html>
<!-- /art-lab/: the pixel workshop (v4, docs/ART_BIBLE.md § 1). ONLY in `npm run dev`: it is not in PAGES, so Vite never
     builds it, and tests/art.spec.js checks that it is not in dist/. It reads the grids of art/ directly (no npm run art). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Art lab</title>
  <style>
    :root { color-scheme: dark; --ink: #f6f2ea; --bg: #0b0f1e; --card: #1b2a4a; --line: #2c4170; --yellow: #f2c14e; --paper: #f6f2ea; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-monospace, Menlo, monospace; }
    h1 { margin: 0 0 8px; font-size: 18px; color: var(--yellow); }
    h2 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8fb0d8; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
    label { display: inline-flex; gap: 6px; align-items: center; }
    select, button { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 4px 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { font-size: 12px; color: #b9c1cf; margin-top: 4px; }
    canvas { display: block; image-rendering: pixelated; background: #2f7d32; }
    canvas.paper { background: var(--paper); }
    canvas.clear { background: repeating-conic-gradient(#1b2a4a 0 25%, #0f1a30 0 50%) 0 0 / 16px 16px; }
    .error { color: #e0533f; white-space: pre-wrap; }
    .crops { display: flex; flex-wrap: wrap; gap: 12px; }
    .crops canvas { border: 1px solid var(--line); }
  </style>
</head>
<body>
  <h1>Art lab</h1>
  <div class="controls">
    <label>Sheet <select id="sheet"></select></label>
    <label>Variant <select id="variant"></select></label>
    <label>Tag <select id="tag"></select></label>
    <label><input type="checkbox" id="onion" checked> Onion skin</label>
    <label><input type="checkbox" id="gridlines" checked> Grid</label>
    <button type="button" id="play">Pause</button>
  </div>
  <p class="error" id="error" hidden></p>
  <h2>Frames at 8× (tag)</h2>
  <div class="row" id="frames"></div>
  <h2>Animation at real speed (durations of the JSON)</h2>
  <div class="row">
    <figure><canvas id="anim8" width="384" height="384"></canvas><figcaption id="anim-cap">8×</figcaption></figure>
    <figure><canvas id="anim3" width="144" height="144" class="clear"></canvas><figcaption>3× (phone)</figcaption></figure>
    <figure><canvas id="anim1" width="48" height="48" class="clear"></canvas><figcaption>1×</figcaption></figure>
  </div>
  <h2>Before / after · silhouette · greys (frame 0 of the tag)</h2>
  <div class="row">
    <figure><canvas id="before" width="384" height="384" class="clear"></canvas><figcaption>Before (old sprite)</figcaption></figure>
    <figure><canvas id="after" width="384" height="384" class="clear"></canvas><figcaption>After</figcaption></figure>
    <figure><canvas id="silhouette" width="384" height="384" class="paper"></canvas><figcaption>Silhouette</figcaption></figure>
    <figure><canvas id="grey" width="384" height="384" class="clear"></canvas><figcaption>Greys</figcaption></figure>
  </div>
  <h2>Camera crops</h2>
  <div class="crops" id="crops"></div>
  <script type="module" src="./lab.js"></script>
</body>
</html>
